[project]
name = "best-bit-2026"
version = "0.1.0"
description = "AI Security Workshop: Attacks on AI Models"
requires-python = ">=3.11"
dependencies = [
    # LLM / Agent
    "groq>=0.13.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    # MCP
    "mcp>=1.0.0",
    # RAG / Embeddings
    "supabase>=2.10.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    # ML / Data Science
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    # API serving (model-stealing victim)
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv]
package = false
# For CPU-only PyTorch (recommended for workshop — avoids large CUDA downloads)
# Run: uv sync --extra-index-url https://download.pytorch.org/whl/cpu
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
